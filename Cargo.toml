[package]
name = "coding-quota"
version = "0.1.0"
edition = "2021"
description = "Unified coding-plan quota viewer for Codex, Grok, GLM, Kimi, and Cursor"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
unicode-width = "0.2"
raw-window-handle = { version = "0.6", optional = true }

[features]
gui = ["dep:eframe", "dep:raw-window-handle"]

[[bin]]
name = "coding-quota-desktop"
path = "src/bin/desktop.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true
